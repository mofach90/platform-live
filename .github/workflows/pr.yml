# Pull request pipeline: validate + scan → find changed projects → plan each one → one PR comment.
# Identity: ci-plan (read-only). It can read state and plan as planner@<team project>;
# it can never change infrastructure or state.
name: pr

on:
  pull_request:
    branches: [main]

# Least privilege: each job asks for what it needs on top of this.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.17.1"   # keep in sync with .tool-versions
  WIF_PROVIDER: projects/54569984113/locations/global/workloadIdentityPools/github/providers/github-oidc
  CI_PLAN_SA: ci-plan@platform-project-dev-514319.iam.gserviceaccount.com

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: make fmt-check validate

  # Lint and security scan, same commands as `make check` locally. Runs next to the plan and does
  # not block it, so a reviewer sees the findings and the plan together.
  scan:
    runs-on: ubuntu-24.04
    env:
      # Keep the versions in sync with .tool-versions; the hashes are from each release's checksum file.
      TFLINT_VERSION: "0.66.0"
      TFLINT_SHA256: 22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e
      TRIVY_VERSION: "0.76.2"
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the whole history
      - name: Install tflint, trivy, gitleaks (pinned version + checksum)
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"; mkdir -p "$bin"; cd "$(mktemp -d)"
          get() { curl -fsSL --retry 3 -o "$1" "$2"; echo "$3  $1" | sha256sum --check --quiet; }
          get tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v$TFLINT_VERSION/tflint_linux_amd64.zip" "$TFLINT_SHA256"
          get trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "$TRIVY_SHA256"
          get gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256"
          unzip -q tflint.zip -d "$bin"
          tar -xzf trivy.tgz -C "$bin" trivy
          tar -xzf gitleaks.tgz -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
      - name: make lint
        env:
          GITHUB_TOKEN: ${{ github.token }}   # tflint downloads its Google ruleset from GitHub
        run: make lint
      - name: make scan
        if: always()
        run: make scan

  changes:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: matrix
        env:
          BASE_REF: ${{ github.base_ref }}
        run: echo "matrix=$(python3 scripts/changed_projects.py "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"

  plan:
    needs: [validate, changes]
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write      # request the GitHub OIDC token for Workload Identity Federation
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_PLAN_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Plan
        env:
          TF_CLI_ARGS_plan: -no-color
          # Values from the PR go through env, never straight into the script text.
          LAYER: ${{ matrix.layer }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -o pipefail
          make plan LAYER="$LAYER" PROJECT="$PROJECT" IDENTITY=planner 2>&1 \
            | tee "plan-$PROJECT-$LAYER.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: plan-${{ matrix.project }}-${{ matrix.layer }}
          path: plan-${{ matrix.project }}-${{ matrix.layer }}.txt

  comment:
    needs: [plan]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write # post the plan comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          merge-multiple: true
          path: plans
      - name: Create or update the plan comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- platform-plan -->'
          {
            echo "$marker"
            echo "## Terraform plan"
            echo "Commit \`${SHA:0:7}\` · read-only identity \`ci-plan\` → \`planner@<project>\`"
            for f in plans/plan-*.txt; do
              [ -e "$f" ] || continue
              title="$(basename "$f" .txt)"; title="${title#plan-}"
              summary="$(grep -E '^(Plan:|No changes\.|Error:|│ Error:)' "$f" | head -1)"
              echo
              echo "<details><summary><b>${title}</b> — ${summary:-see details}</summary>"
              echo
              echo '```'
              grep -v 'Refreshing state\|Reading\.\.\.\|Read complete' "$f" | tail -c 14000
              echo '```'
              echo "</details>"
            done
          } > body.md
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
          fi
