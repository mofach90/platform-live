# Fast feedback before each commit. CI runs the full `make check` (pr.yml, PLAN step 4/11).
# External hooks are pinned by commit SHA (AGENTS.md rule 6). Local hooks use the
# binaries pinned in .tool-versions, so tool versions live in one place.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -recursive -check -diff
        language: system
        files: \.tf$
        pass_filenames: false
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
