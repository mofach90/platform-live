apiVersion: platform.demo/v1
kind: Workload
metadata: { team: blog, env: dev }
spec:
  project: blog-dev       # must exist in platform/dev.yaml and belong to team "blog"
  vmGroups:
    - name: web           # renaming a group = destroy + create
      count: 1            # 1..5
      size: small         # small | medium | large
      image: debian-12    # allow-list
